name: Legacy favorites migration

# Read or copy the pre-ownership global Favorite rows into the owner's
# per-user favorites. DRY_RUN is the default. APPLY requires an explicit
# confirmation and a verified database backup.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'DRY_RUN to inspect, APPLY to copy to the owner'
        required: true
        default: 'DRY_RUN'
        type: choice
        options:
          - DRY_RUN
          - APPLY
      confirm:
        description: 'Type DRY_RUN, or APPLY_FAVORITES for an apply'
        required: true
        type: string
      owner_username:
        description: 'SAP owner username'
        required: true
        default: 'AKASH'
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-favorites
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      OWNER_USERNAME: ${{ inputs.owner_username }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::Missing TURSO_DATABASE_URL or TURSO_AUTH_TOKEN repository secret."
            exit 1
          fi
          if [ "$MODE" = "DRY_RUN" ] && [ "$CONFIRM" != "DRY_RUN" ]; then
            echo "::error::Type DRY_RUN in the confirm input for a dry run."
            exit 1
          fi
          if [ "$MODE" = "APPLY" ] && [ "$CONFIRM" != "APPLY_FAVORITES" ]; then
            echo "::error::Type APPLY_FAVORITES in the confirm input to apply. Take a verified backup first."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run legacy favorites migration
        run: |
          if [ "$MODE" = "APPLY" ]; then
            APPLY=YES
          else
            APPLY=NO
          fi
          echo "mode=$MODE owner=$OWNER_USERNAME"
          APPLY="$APPLY" CONFIRM_LEGACY_FAVORITES=YES NODE_ENV=production \
            bun run scripts/migrate-legacy-favorites.ts
