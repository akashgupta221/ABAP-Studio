name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./db/ci.db
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/*.test.ts

      - name: Disposable API/security suite
        run: bun run test:api

      - name: UI and accessibility suite
        run: bun run test:ui

      - name: Prepare build database
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: Production build
        run: bun run build

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
