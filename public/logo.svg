<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31a7e8"/>
      <stop offset="0.55" stop-color="#0a6ed1"/>
      <stop offset="1" stop-color="#0c3c63"/>
    </linearGradient>
    <style type="text/css">
      .forge-glow { animation: forge-pulse 2.4s ease-in-out infinite; }
      @keyframes forge-pulse { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.5; } }
    </style>
  </defs>

  <!-- rounded steel tile -->
  <rect x="0.8" y="0.8" width="28.4" height="28.4" rx="7" fill="url(#bg)"/>
  <rect x="1.7" y="1.7" width="26.6" height="11.5" rx="5.2" fill="#ffffff" opacity="0.08"/>

  <!-- anvil silhouette -->
  <g fill="#ffffff">
    <!-- top plate -->
    <rect x="7.2" y="8.6" width="16.2" height="3.6" rx="1.2"/>
    <!-- horn (left) -->
    <polygon points="2.8,10.7 7.8,9.1 7.8,12.7 4.0,12.3"/>
    <!-- waist -->
    <polygon points="11.4,12.0 19.2,12.0 18.3,15.9 12.3,15.9"/>
    <!-- base -->
    <polygon points="9.7,16.1 20.3,16.1 21.9,19.3 21.9,21.6 8.1,21.6 8.1,19.3"/>
  </g>

  <!-- forge spark -->
  <circle class="forge-glow" cx="23.4" cy="5.6" r="3.4" fill="#ffb02e"/>
  <path d="M23.4 2.6 C23.8 4.4 24.5 5.1 26.2 5.6 C24.5 6.1 23.8 6.8 23.4 8.6 C23.0 6.8 22.3 6.1 20.6 5.6 C22.3 5.1 23.0 4.4 23.4 2.6 Z" fill="#ffb02e"/>
</svg>
